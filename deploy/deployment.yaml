schema_version: 1
application: notes
build:
  dockerfile: notes-server-go/Dockerfile
  context: .
container:
  port: 8000
  host_port: 8000
  bind_address: 127.0.0.1
health:
  readiness_path: /api/v1/health/ready
  startup_timeout_seconds: 120
resources:
  memory_limit: 512m
  cpus: 1.0
required_config: []
hooks:
  pre_install:
    script: deploy/hooks/pre-install.sh
    timeout_seconds: 300
    refresh_config: false
  post_install:
    script: deploy/hooks/post-install.sh
    timeout_seconds: 120
