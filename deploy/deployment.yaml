schema_version: 1
application: notes
build:
  dockerfile: notes-server-go/Dockerfile
  context: .
container:
  port: 8000
  host_port: 8000
  bind_address: 127.0.0.1
health:
  readiness_path: /api/v1/health/ready
  startup_timeout_seconds: 120
resources:
  memory_limit: 512m
  cpus: 1.0
required_config:
- DATABASE_URL
- APP_ORIGIN
- COOKIE_SECURE
