name: Native release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: notes-server-go/go.mod
          cache-dependency-path: notes-server-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notes-web/package-lock.json
      - name: Validate and build release
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          go -C notes-server-go test ./...
          go -C notes-server-go vet ./...
          bash notes-server-go/ops/build-native.sh "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/notes-release"
      - name: Publish checksummed native runtime packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes-release/"*.tar.gz "$RUNNER_TEMP/notes-release/checksums.txt" --verify-tag --title "Notes $GITHUB_REF_NAME" --generate-notes
