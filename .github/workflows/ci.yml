name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: notes-server-go/go.mod
          cache-dependency-path: notes-server-go/go.sum
      - name: Go test, race, vet and build
        working-directory: notes-server-go
        run: |
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 go build ./cmd/shiji
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notes-web/package-lock.json
      - name: Web tests and build
        working-directory: notes-web
        run: |
          npm ci
          npm test
          npm run build
      - name: Installer syntax and regression
        run: |
          for script in install.sh install-native.sh install-client.sh deploy/*.sh deploy/hooks/*.sh notes-server-go/ops/*.sh notes-server-go/ops/native/*.sh; do bash -n "$script"; done
          if ! command -v jq >/dev/null; then sudo apt-get update && sudo apt-get install -y jq; fi
          python3 tests/deploy_test.py
          python3 tests/config_hub_start_test.py
          python3 tests/native_config_test.py
          python3 tests/team_config_test.py
          python3 tests/team_hook_test.py
          python3 tests/native_install_test.py
          python3 tests/client_install_test.py
  native-systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: notes-server-go/go.mod
          cache-dependency-path: notes-server-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: notes-web/package-lock.json
      - name: Build both native architectures
        run: bash notes-server-go/ops/build-native.sh 0.0.0-ci "$RUNNER_TEMP/notes-native"
      - name: Real systemd, non-root Go/Web and TLS PostgreSQL
        run: sudo env CI=true python3 tests/native_smoke.py "$RUNNER_TEMP/notes-native"
  client-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: CLI and Skill installer regression
        run: python tests/client_install_test.py
      - name: PowerShell installation entry point
        shell: pwsh
        run: |
          $skillRoot = Join-Path $env:RUNNER_TEMP 'notes-client-skills'
          $commandRoot = Join-Path $env:RUNNER_TEMP 'notes-client-bin'
          ./install-client.ps1 -SourceDir $pwd.Path -SkillsDir $skillRoot -BinDir $commandRoot -Python (Get-Command python).Source -NoPathUpdate
          & (Join-Path $commandRoot 'shiji-notes.cmd') --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI help failed' }
  docker-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production Docker image
        run: docker build -f notes-server-go/Dockerfile -t shiji-ci .
      - name: Release test build stages
        run: bash notes-server-go/ops/test-release.sh
      - name: PostgreSQL 16 API and backup restore smoke
        run: python3 tests/pg_smoke.py
      - name: Real ConfigHub startup with TLS PostgreSQL
        run: python3 tests/startup_smoke.py
      - name: Check out exact configuration-refresh platform
        uses: actions/checkout@v4
        with:
          repository: art-shier/deployctl
          ref: 9e62828e4f2a31f1b06d9bb5a500a16baafb8609
          path: .ci-platform
          persist-credentials: false
      - name: Install contract parser
        # sudo must use this same interpreter with the installed parser.
        run: python3 -m pip install PyYAML==6.0.3
      - name: Standard hook package round-trip
        run: python3 tests/team_package_test.py .ci-platform
      - name: Real packaged hooks, ctl and TLS PostgreSQL
        run: sudo env CI=true "$(command -v python3)" tests/team_smoke.py .ci-platform
